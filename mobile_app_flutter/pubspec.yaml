name: smart_security_agent_app
description: Smart Security Agent mobile application starter.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.3
  image_picker: ^1.1.2
  share_plus: ^10.1.3
  url_launcher: ^6.3.1
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  generate: true
  uses-material-design: true
